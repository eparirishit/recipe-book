<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f1e5">
<title>Recipe Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <main id="view"></main>
  <nav id="tabbar" aria-label="Primary">
    <button class="tab" data-tab="home" aria-label="Recipes">
      <svg viewBox="0 0 24 24"><path d="M4 11h16v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-9zm0-7h16v5H4V4zm2 2v1h2V6H6zm12 0v1h-2V6h2z"/></svg>
      <span>Recipes</span>
    </button>
    <button class="tab fab" data-tab="add" aria-label="Add recipe">
      <svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5z"/></svg>
    </button>
    <button class="tab" data-tab="grocery" aria-label="Grocery list">
      <svg viewBox="0 0 24 24"><path d="M6 7V6a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3v1h3v2h-3v11a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V9H3V7h3zm2 0h8V6a1 1 0 0 0-1-1H9a1 1 0 0 0-1 1v1z"/></svg>
      <span>Grocery</span>
    </button>
    <button class="tab" data-tab="favorites" aria-label="Favorites">
      <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.9-9.7-9.2C.7 8.6 2.6 5 6 5c2 0 3.4 1.1 4 2.2C10.6 6.1 12 5 14 5c3.4 0 5.3 3.6 3.7 6.8C19.5 16.1 12 21 12 21z"/></svg>
      <span>Saved</span>
    </button>
  </nav>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
